name: Signed release
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag", required: true }
      kodiSourceUrl: { description: "Reviewed Kodi skin source ZIP URL", required: true, default: "https://github.com/xbmc/xbmc/archive/refs/tags/21.3-Omega.zip" }
      kodiSourceSha256: { description: "Pinned SHA-256 for the reviewed Kodi source", required: true, default: "5710900629c2aedb63df0665c7d78c1b50325a625297e2f9bafc262d65d8c075" }

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - run: pip install -r tools/requirements.txt
      - name: Prepare signing material
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .secrets artifacts/skin
          echo "$ANDROID_KEYSTORE" | base64 -d > .secrets/release.jks
      - name: Verify offline-signed manifest
        run: python tools/release.py verify config/manifest.json --public-key config/manifest.pub
      - name: Validate fresh-install release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/validate_fresh_install_release.py --tag "$RELEASE_TAG"
      - name: Build branded skin from pinned source
        env:
          SOURCE_URL: ${{ inputs.kodiSourceUrl }}
          SOURCE_SHA: ${{ inputs.kodiSourceSha256 }}
        run: |
          curl --fail --location "$SOURCE_URL" --output artifacts/kodi-source.zip
          echo "$SOURCE_SHA  artifacts/kodi-source.zip" | sha256sum --check
          python tools/skin_builder.py --upstream-archive artifacts/kodi-source.zip --manifest config/manifest.json --output artifacts/skin
      - run: python tools/release.py kodi --output artifacts/kodi --base-url "https://github.com/rjclark99/starlanemeridian/releases/latest/download" --data-url "https://control.starlanemeridian.uk/v1/public/kodi"
      - run: python tools/verify_kodi_package_lock.py --local-assets artifacts/kodi --require-id skin.starlane.movies --require-id plugin.video.umbrella
      - name: Verify fresh-install release packages
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python tools/validate_fresh_install_release.py --tag "$RELEASE_TAG" --kodi-assets artifacts/kodi
      - name: Build signed Android APK
        working-directory: android-app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease -PreleaseStoreFile=../.secrets/release.jks -PreleaseStorePassword="$STORE_PASSWORD" -PreleaseKeyAlias="$KEY_ALIAS" -PreleaseKeyPassword="$KEY_PASSWORD" -PmanifestUrl="https://github.com/rjclark99/starlanemeridian/releases/latest/download/manifest.json" -PmanifestPublicKey="$(cat ../config/manifest.pub)" -PcontrolApiUrl="https://control.starlanemeridian.uk"
      - run: cp android-app/app/build/outputs/apk/release/app-release.apk artifacts/setup.apk
      - run: cp config/manifest.json artifacts/manifest.json
      - uses: anchore/sbom-action@v0
        with: { path: ".", output-file: "artifacts/sbom.spdx.json", format: "spdx-json" }
      - run: python tools/release.py checksums --artifacts artifacts --output artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            artifacts/setup.apk
            artifacts/SHA256SUMS
            artifacts/sbom.spdx.json
            artifacts/kodi/**/*
            artifacts/manifest.json
